<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What We Check — Redesign Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f4f0; font-family: 'Geist', system-ui, sans-serif; }
  #root { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas
      title="SideHustleGuard — “What we check” redesign"
      subtitle="Three aesthetic directions. Click any artboard to focus."
    >
      <DCSection id="middle-ground" title="In between — has personality, doesn't shout">
        <DCArtboard
          id="warm-modern"
          label="D — Warm modern"
          width={1200}
          height={820}
        >
          <DirectionWarmModern />
        </DCArtboard>
        <DCArtboard
          id="soft-interactive"
          label="E — Soft interactive"
          width={1200}
          height={720}
        >
          <DirectionSoftInteractive />
        </DCArtboard>
      </DCSection>
      <DCSection id="originals" title="Original three (for reference)">
        <DCArtboard
          id="editorial"
          label="A — Editorial magazine"
          width={1200}
          height={1100}
        >
          <DirectionEditorial />
        </DCArtboard>
        <DCArtboard
          id="calm"
          label="B — Calm utility"
          width={1200}
          height={760}
        >
          <DirectionCalm />
        </DCArtboard>
        <DCArtboard
          id="maximalist"
          label="C — Bold maximalist"
          width={1200}
          height={820}
        >
          <DirectionMaximalist />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
